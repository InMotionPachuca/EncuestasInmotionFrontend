<div class="responder-container d-flex flex-column min-vh-100 align-items-center justify-content-center py-5">
  <!-- Toast Notification -->
  <div *ngIf="showToast" [@toastAnimation] class="custom-toast shadow-lg" [ngClass]="toastType">
    <div class="d-flex align-items-center">
      <i class="fas fs-4" [ngClass]="{'fa-check-circle text-success': toastType === 'success', 'fa-exclamation-circle text-danger': toastType === 'error'}"></i>
      <span class="ms-3 fw-medium">{{ toastMessage }}</span>
    </div>
  </div>

  <div class="encuesta-card shadow-lg p-4 p-md-5 rounded-4 bg-white w-100" style="max-width: 650px;" [@fadeInUp]>
    <div class="text-center mb-5">
      <div class="logo-wrapper mb-3">
        <img src="assets/logos/inmotion.png" alt="InMotion" class="logo-principal" (error)="onLogoError($event)">
      </div>
      <h2 class="form-title fw-bold text-dark mb-2">Evaluación de Compra</h2>
      <p class="form-subtitle text-muted">{{ obtenerNombreMarca() }} - Agradecemos su preferencia en la compra de su unidad, nos gustaría conocer su experiencia.</p>
    </div>

    <form [formGroup]="encuestaForm" (ngSubmit)="enviarRespuesta()">
      <div class="row g-4 mb-5">
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary">Nombre Completo <span class="text-danger">*</span></label>
          <input type="text" class="form-control custom-input" formControlName="nombreCliente" placeholder="Ej. Juan Pérez"
                 [ngClass]="{'is-invalid': encuestaForm.get('nombreCliente')?.invalid && encuestaForm.get('nombreCliente')?.touched}">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold text-secondary">Teléfono (Opcional)</label>
          <input type="text" class="form-control custom-input" formControlName="telefono" placeholder="10 dígitos">
        </div>
      </div>

      <div class="preguntas-section">
        <!-- Pregunta 1 -->
        <div class="pregunta-box mb-4 p-4 rounded-4" [ngClass]="{'error-box': encuestaForm.get('trato')?.invalid && encuestaForm.get('trato')?.touched}">
          <label class="d-block mb-4 fw-bold text-dark fs-5">1. ¿Cómo considera el trato que recibió de parte de la agencia? <span class="text-danger">*</span></label>
          <div class="stars-container d-flex justify-content-center gap-2 gap-md-4">
            <i *ngFor="let star of [1,2,3,4,5]" 
               class="fas fa-star star-icon"
               [ngClass]="{'active': getCalificacion('trato') >= star}"
               (click)="setCalificacion('trato', star)">
            </i>
          </div>
          <div class="d-flex justify-content-between mt-3 text-muted small px-2 fw-medium">
            <span>Deficiente</span>
            <span>Excelente</span>
          </div>
        </div>

        <!-- Pregunta 2 -->
        <div class="pregunta-box mb-4 p-4 rounded-4" [ngClass]="{'error-box': encuestaForm.get('experiencia')?.invalid && encuestaForm.get('experiencia')?.touched}">
          <label class="d-block mb-4 fw-bold text-dark fs-5">2. ¿Cómo evaluaría su experiencia con la agencia? <span class="text-danger">*</span></label>
          <div class="stars-container d-flex justify-content-center gap-2 gap-md-4">
            <i *ngFor="let star of [1,2,3,4,5]" 
               class="fas fa-star star-icon"
               [ngClass]="{'active': getCalificacion('experiencia') >= star}"
               (click)="setCalificacion('experiencia', star)">
            </i>
          </div>
          <div class="d-flex justify-content-between mt-3 text-muted small px-2 fw-medium">
            <span>Deficiente</span>
            <span>Excelente</span>
          </div>
        </div>

        <!-- Pregunta 3 -->
        <div class="pregunta-box mb-4 p-4 rounded-4" [ngClass]="{'error-box': encuestaForm.get('asesor')?.invalid && encuestaForm.get('asesor')?.touched}">
          <label class="d-block mb-4 fw-bold text-dark fs-5">3. ¿Cómo calificaría su experiencia con su asesor de compras? <span class="text-danger">*</span></label>
          <div class="stars-container d-flex justify-content-center gap-2 gap-md-4">
            <i *ngFor="let star of [1,2,3,4,5]" 
               class="fas fa-star star-icon"
               [ngClass]="{'active': getCalificacion('asesor') >= star}"
               (click)="setCalificacion('asesor', star)">
            </i>
          </div>
          <div class="d-flex justify-content-between mt-3 text-muted small px-2 fw-medium">
            <span>Deficiente</span>
            <span>Excelente</span>
          </div>
        </div>

        <!-- Pregunta 4 -->
        <div class="pregunta-box mb-5 p-4 rounded-4" [ngClass]="{'error-box': encuestaForm.get('tramite')?.invalid && encuestaForm.get('tramite')?.touched}">
          <label class="d-block mb-4 fw-bold text-dark fs-5">4. ¿Cómo evaluaría el trámite realizado para la compra de su vehículo? <span class="text-danger">*</span></label>
          <div class="stars-container d-flex justify-content-center gap-2 gap-md-4">
            <i *ngFor="let star of [1,2,3,4,5]" 
               class="fas fa-star star-icon"
               [ngClass]="{'active': getCalificacion('tramite') >= star}"
               (click)="setCalificacion('tramite', star)">
            </i>
          </div>
          <div class="d-flex justify-content-between mt-3 text-muted small px-2 fw-medium">
            <span>Deficiente</span>
            <span>Excelente</span>
          </div>
        </div>

        <!-- Pregunta 5 -->
        <div class="pregunta-box mb-5 p-4 rounded-4" [ngClass]="{'error-box': encuestaForm.get('recomienda')?.invalid && encuestaForm.get('recomienda')?.touched}">
          <label class="d-block mb-4 fw-bold text-dark fs-5">5. ¿Recomendaría nuestro servicio con familiares y amigos? <span class="text-danger">*</span></label>
          <div class="d-flex justify-content-center gap-4">
            <button type="button" 
                    class="btn px-5 py-2 fw-bold"
                    [ngClass]="getOpcionRecomienda() === 'SI' ? 'btn-success' : 'btn-outline-success'"
                    (click)="setOpcionRecomienda('SI')">
              SÍ
            </button>
            <button type="button" 
                    class="btn px-5 py-2 fw-bold"
                    [ngClass]="getOpcionRecomienda() === 'NO' ? 'btn-danger' : 'btn-outline-danger'"
                    (click)="setOpcionRecomienda('NO')">
              NO
            </button>
          </div>
        </div>
      </div>

      <!-- Comentarios -->
      <div class="mb-5">
        <label class="form-label fw-bold text-dark fs-5">6. Algún comentario o sugerencia.</label>
        <textarea class="form-control custom-textarea p-3" formControlName="comentarios" rows="4" placeholder="Tus comentarios nos ayudan a brindarte un mejor servicio..."></textarea>
      </div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-submit w-100 py-3 rounded-pill shadow-sm fw-bold fs-5 text-white" [disabled]="enviando">
          <span *ngIf="!enviando">Enviar Encuesta <i class="fas fa-paper-plane ms-2"></i></span>
          <span *ngIf="enviando"><i class="fas fa-spinner fa-spin me-2"></i>Enviando...</span>
        </button>
      </div>
    </form>
  </div>
</div>
