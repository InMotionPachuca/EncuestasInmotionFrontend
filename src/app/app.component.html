<ng-container *ngIf="isPublicRoute()">
  <router-outlet></router-outlet>
</ng-container>

<ng-container *ngIf="!isPublicRoute()">
  <!-- NAVBAR PRINCIPAL INSTITUCIONAL -->
  <nav class="navbar navbar-expand-lg shadow-sm"
    style="background: linear-gradient(135deg, #0A0A0A 0%, #1A1A1A 60%, #1F1F1F 100%); border-bottom: 3px solid #C5A059; padding: 10px 28px;">
    <div class="container-fluid d-flex align-items-center justify-content-between">

      <!-- LOGO + MARCA (LADO IZQUIERDO) -->
      <div class="navbar-brand d-flex align-items-center gap-3" style="cursor: default; padding: 0; margin: 0;">
        <!-- LOGO ALARGADO Y ESTILIZADO -->
        <img src="assets/inmo1.png" alt="Team InMotion" style="
            display: block; 
            height: 52px; 
            width: auto; 
            max-width: 220px; 
            object-fit: contain;
            filter: invert(68%) sepia(35%) saturate(542%) hue-rotate(6deg) brightness(93%) contrast(88%) drop-shadow(0 2px 6px rgba(197, 160, 89, 0.25)) !important;
            transition: transform 0.3s ease;
          " (error)="onLogoError($event)">
        <!-- TEXTO SEPARADOR CON BORDES DORADOS MATE -->
        <span class="text-white fw-light"
          style="font-size: 0.85rem; opacity: 0.7; letter-spacing: 2.5px; border-left: 1px solid rgba(197, 160, 89, 0.3); padding-left: 16px; font-family: 'Montserrat', sans-serif;">
          CONTROL CLIENTES
        </span>
      </div>

      <!-- ÁREA DE USUARIO Y LOGOUT (LADO DERECHO) -->
      <div class="d-flex align-items-center gap-3">
        <!-- ÁREA DEL USUARIO -->
        <div class="user-dropdown-container">
          <button type="button" class="user-profile-btn" (click)="toggleUserMenu()" title="Opciones de perfil">
            <i class="fas fa-user-circle me-1" style="color: #C5A059; font-size: 1.1rem;"></i>
            <strong style="color: #9A7B3E;">{{ getUserName() }}</strong>
            <i class="fas fa-chevron-down ms-1" style="font-size: 0.7rem; color: #9A7B3E;"></i>
          </button>

          <!-- Menú Flotante Desplegable -->
          <div class="user-dropdown-menu shadow" *ngIf="mostrarMenuUsuario">
            <div class="dropdown-header border-bottom pb-2 mb-2">
              <small class="text-muted d-block" style="font-size: 0.75rem;">Sesión activa:</small>
              <span class="fw-bold text-dark small text-truncate d-block">{{ getUserEmail() }}</span>
            </div>

            <button class="dropdown-item-custom" (click)="abrirModalPassword()">
              <i class="fas fa-key text-warning me-2"></i> Cambiar Contraseña
            </button>
          </div>
        </div>

        <!-- Botón Salir Principal -->
        <button class="btn-logout" (click)="logout()"
          style="border-color: #C5A059; color: #9A7B3E; background: #FDF8ED;">
          <span class="logout-icon" style="color: #C5A059;">⏻</span>
          <span class="logout-text">Salir</span>
        </button>
      </div>

    </div>
  </nav>

  <div class="app-layout" *ngIf="!isPublicRoute()">
    <!-- NAVBAR SUPERIOR -->
    <header class="top-navbar">
      <div class="navbar-left d-flex align-items-center gap-2">
        <!-- BOTÓN HAMBURGUESA / COLAPSAR -->
        <button type="button" class="btn-toggle-sidebar" (click)="toggleSidebar()" title="Ocultar/Mostrar menú">
          <i class="fas fa-bars"></i>
        </button>
        <span class="app-title">InMotion Encuestas</span>
      </div>

      <!-- Menú de usuario superior -->
      <div class="navbar-right">
        <!-- ... tus controles de usuario ... -->
      </div>
    </header>

    <div class="app-body">
      <!-- BARRA LATERAL (SIDEBAR) -->
      <aside class="sidebar" [class.sidebar-collapsed]="sidebarOculta">
        <nav class="sidebar-nav">
          <ul>
            <li *ngFor="let item of menuItems">
              <a [routerLink]="item.route" routerLinkActive="active" [title]="item.label">
                <i [class]="item.icon"></i>
                <span class="menu-label" *ngIf="!sidebarOculta">{{ item.label }}</span>
                <span *ngIf="item.badge && !sidebarOculta" class="badge" [ngClass]="item.badgeClass">
                  {{ item.badge }}
                </span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- CONTENIDO PRINCIPAL -->
      <main class="main-content" [class.content-expanded]="sidebarOculta">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>

  <router-outlet *ngIf="isPublicRoute()"></router-outlet>
  <!-- ÁREA DE VISTA DINÁMICA -->
  <div class="flex-grow-1 p-4"
    style="background: linear-gradient(180deg, #F8F9FA 0%, #FFFFFF 100%); min-height: 100vh;">
    <router-outlet></router-outlet>
  </div>

</ng-container>

<!-- MODAL CAMBIAR CONTRASEÑA -->
<div class="modal-backdrop-custom" *ngIf="mostrarModalPassword">
  <div class="modal-dialog-custom">
    <div class="modal-content-custom">
      <div class="modal-header-custom">
        <h5 class="m-0 fw-bold fs-6"><i class="fas fa-lock me-2 text-warning"></i>Cambiar Contraseña</h5>
        <button type="button" class="btn-close-custom" (click)="cerrarModalPassword()">×</button>
      </div>

      <div class="modal-body-custom">
        <form [formGroup]="passwordForm" (ngSubmit)="cambiarPassword()">

          <!-- Contraseña Actual con Ojito -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-dark">Contraseña Actual</label>
            <div class="input-password-wrapper">
              <input [type]="mostrarPasswordActual ? 'text' : 'password'" formControlName="passwordActual"
                class="form-control form-control-sm input-with-eye" placeholder="Ingresa tu contraseña actual">
              <button type="button" class="btn-eye" (click)="toggleVerPasswordActual()"
                title="Mostrar/Ocultar contraseña">
                <i [class]="mostrarPasswordActual ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
          </div>

          <!-- Nueva Contraseña con Ojito -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-dark">Nueva Contraseña</label>
            <div class="input-password-wrapper">
              <input [type]="mostrarNuevaPassword ? 'text' : 'password'" formControlName="nuevaPassword"
                class="form-control form-control-sm input-with-eye" placeholder="Mínimo 8 caracteres">
              <button type="button" class="btn-eye" (click)="toggleVerNuevaPassword()"
                title="Mostrar/Ocultar contraseña">
                <i [class]="mostrarNuevaPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
          </div>

          <div *ngIf="mensajePasswordError" class="alert alert-danger py-2 small mb-3">
            {{ mensajePasswordError }}
          </div>

          <div *ngIf="mensajePasswordSuccess" class="alert alert-success py-2 small mb-3">
            {{ mensajePasswordSuccess }}
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light btn-sm" (click)="cerrarModalPassword()">Cancelar</button>
            <button type="submit" class="btn btn-primary-custom btn-sm"
              [disabled]="loadingPassword || passwordForm.invalid">
              <span *ngIf="!loadingPassword">Guardar Contraseña</span>
              <span *ngIf="loadingPassword">Actualizando...</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
